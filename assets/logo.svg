<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" role="img" aria-label="EasyCare Phone Service logo">
  <defs>
    <linearGradient id="ecg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12a594"/>
      <stop offset="1" stop-color="#0b7c72"/>
    </linearGradient>
  </defs>
  <!-- icon badge -->
  <rect x="14" y="30" width="140" height="140" rx="34" fill="url(#ecg)"/>
  <!-- phone body -->
  <rect x="56" y="52" width="56" height="96" rx="12" fill="#ffffff"/>
  <rect x="63" y="63" width="42" height="62" rx="5" fill="#0b7c72"/>
  <rect x="76" y="134" width="16" height="6" rx="3" fill="#0b7c72"/>
  <!-- signal arcs on screen -->
  <path d="M72 96 q12 -14 24 0" stroke="#ffffff" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M78 106 q6 -7 12 0" stroke="#ffffff" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- check badge -->
  <circle cx="122" cy="122" r="30" fill="#ffffff"/>
  <circle cx="122" cy="122" r="24" fill="#f59e0b"/>
  <path d="M112 122 l7 7 l14 -15" stroke="#ffffff" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- wordmark -->
  <text x="178" y="108" font-family="Verdana, Geneva, sans-serif" font-size="64" font-weight="bold" fill="#14324a" letter-spacing="1">EasyCare</text>
  <text x="180" y="148" font-family="Verdana, Geneva, sans-serif" font-size="30" font-weight="bold" fill="#0b7c72" letter-spacing="10">PHONE SERVICE</text>
</svg>
